# nginx site: receives the web traffic on port 80 and passes it to Streamlit on 127.0.0.1:8501.
# Installed by scripts/deploy-app.sh as /etc/nginx/sites-available/stadvdb.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8501;

        # Streamlit keeps a WebSocket (a permanently open connection) to the browser.
        # Without these lines the page loads but hangs on "Connecting...".
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # $http_host keeps the port the browser used (e.g. :10160), which Streamlit's origin check needs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep idle WebSocket connections open instead of cutting them after 60 seconds.
        proxy_read_timeout 86400;
    }
}
