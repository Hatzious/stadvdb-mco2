# Template for .streamlit/secrets.toml, the webapp's per-machine settings.
#
#   1. Copy this file to .streamlit/secrets.toml (same folder). Git ignores that file.
#   2. Set server_id for this machine.
#   3. Fill in the real password.
#   4. On a laptop, switch the three hosts and ports to the tunnel values (see the comments).
#
# Never put the real password in this example file: it is committed to the public repo.

# Which server this copy of the app is: 0, 1 or 2.
#   On a server: its own number (server 0 = Hera, 1 = Artemis, 2 = Athena).
#   On a laptop: whichever server you want the app to act as while testing.
server_id = 0

# Seconds to wait when connecting to a database before treating that server as down.
connect_timeout = 3

[db]
name = "railway"
user = "app"
password = "CHANGE_ME"

# Where each server's database is.
#   On the servers: the internal addresses below, port 5432.
#   On a laptop (through the SSH tunnel): host = "localhost", ports 15430 / 15431 / 15432.

[servers.0]   # server 0 (Hera): all rows
host = "10.20.200.160"
port = 5432

[servers.1]   # server 1 (Artemis): Sprinter rows
host = "10.20.200.161"
port = 5432

[servers.2]   # server 2 (Athena): all other rows
host = "10.20.200.162"
port = 5432
